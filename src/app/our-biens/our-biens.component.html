<app-navbar></app-navbar>
<section id="nos-biens" class="animated fadeIn container-fluid">
  <div class="mt-40"></div>

  <app-search-bar></app-search-bar>

  <div class="container-fluid pt-0 mt-0">
    <div class="row">
      <div class="col-12" id="listProperty">
        <!-- H1 toujours présent pour l'indexation (évite Soft 404) -->
        <div class="row mt-5">
          <h1 class="col text-center" *ngIf="!isFallbackMode || toShow.length === 0">{{ "ourBiens.10" | translate }}</h1>
          <h1 class="col text-center" *ngIf="isFallbackMode && toShow.length > 0">Nos autres biens immobiliers</h1>
        </div>

        <!-- Texte statique SEO : toujours visible pour les crawlers -->
        <p class="col-12 text-center text-muted mt-3 mb-4" style="font-size: 1rem; max-width: 700px; margin-left: auto; margin-right: auto;">
          {{ "ourBiens.20" | translate }}
        </p>
        
        <!-- Message quand aucun bien ne correspond exactement -->
        <div *ngIf="isFallbackMode && toShow.length > 0" class="col-12 text-center mt-3 mb-4">
          <div class="alert alert-info mx-auto" style="max-width: 600px;">
            <i class="fas fa-info-circle mr-2"></i>
            Aucun bien ne correspond exactement à votre recherche. Voici notre sélection d'autres biens disponibles.
          </div>
        </div>

        <!-- Chargement : pas de message "vide" avant la réponse Firestore -->
        <div *ngIf="!hasDataLoaded && toShow.length === 0" class="col-12 text-center mt-4 mb-5">
          <p class="text-muted" style="font-size: 1rem;">{{ "ourBiens.21" | translate }}</p>
        </div>

        <!-- Message quand les données sont chargées mais aucun bien (recherche vide) -->
        <div *ngIf="hasDataLoaded && toShow.length === 0" class="col-12 text-center mt-5 mb-5">
          <p class="text-muted" style="font-size: 1.2rem;">{{ "ourBiens.12" | translate }}</p>
        </div>

        <!-- Liste des biens -->
        <app-view-property-list
          *ngIf="toShow.length > 0"
          [numberProperty]="sharedDatas.numberPropertyOurBiens"
          [propertyList]="toShow"
        >
        </app-view-property-list>
        
        <!-- Bouton "Voir plus" -->
        <div class="row" *ngIf="toShow.length > 0" id="addMore" #addMore>
          <button
            *ngIf="lowerThan(sharedDatas.numberPropertyOurBiens, toShow.length)"
            type="button"
            class="btn btn-outline-danger col-7 col-lg-3 mx-auto text-center"
            (click)="sharedDatas.addPropertiesOurBiens()"
          >
            {{ "ourBiens.11" | translate }}
          </button>
        </div>
      </div>
    </div>
  </div>
</section>

<app-footer></app-footer>
